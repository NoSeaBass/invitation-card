<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101712">
    <meta name="description" content="Invitation à la soutenance de Papa Ibrahima Diop, en licence informatique à l’UCAD.">
    <title>Soutenance — Papa Ibrahima Diop</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page">
      <button class="card" type="button" aria-label="Retourner la carte" aria-pressed="false">
        <span class="card-inner">
          <span class="face front">
            <span class="front-panel">
              <img class="ucad-mark" src="src/ucad-emblem.jpg" alt="Emblème de l’Université Cheikh Anta Diop de Dakar">
              <span class="eyebrow">Invitation à la soutenance</span>
              <span class="title">Papa Ibrahima Diop</span>
              <span class="subtitle">Licence informatique<br>Université Cheikh Anta Diop</span>
              <span class="rule"></span>
              <span class="date">Semaine du mardi 17 novembre 2026</span>
            </span>
          </span>
          <span class="face back">
            <span class="back-inner">
              <span class="details">
                <span class="heading">Projet de soutenance</span>
                <span class="rule"></span>
                <span class="project">Création d’un média ISO d’installation automatisé pour les institutions</span>
              </span>
              <span class="details">
                <span class="heading">Candidat</span>
                <span class="rule"></span>
                <span class="time">Papa Ibrahima Diop</span>
                <span class="location">Licence informatique · Université Cheikh Anta Diop</span>
              </span>
              <span class="terminal-mark" aria-hidden="true">&gt;_</span>
            </span>
          </span>
        </span>
      </button>
      <p class="hint" aria-live="polite">Cliquez sur la carte pour voir le verso</p>
    </main>
  </body>
</html>
